<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JordanShoes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="topbar">
    <p>Frete grátis para todo o Brasil</p>
  </div>

  <header class="hero">
    <div class="container">
      <a href="#" class="logo">
        <img src="img/logo.svg" alt="JordanShoes" class="logo-img">
      </a>

      <div class="hero-text">
        <h1>A melhor loja de Jordan</h1>
        <p>O tênis Jordan é fruto de uma velha e forte parceria entre a Nike e o jogador Michael Jordan.</p>
      </div>
    </div>
  </header>

  <main class="products-section">
    <div class="container">
      <div class="section-header">
        <h2>Os melhores em só lugar</h2>
        <p>A marca Jordan na JordanShoes é a escolha certa para os amantes de sneakers que buscam estilo e conforto.</p>
      </div>

      <div class="products" id="products"></div>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
